<body>
  <h1>Personal CAD Backup</h1>

  <h2>このアプリについて</h2>
  <p>
    このアプリは、個人所有のCAD設計データを
    Google DriveからRaspberry Piに接続した
    USBストレージへ自動バックアップするための
    個人用システムです。
  </p>

  <p>
    Google Drive APIとrcloneを使用して、
    指定フォルダのファイルを定期的に取得し、
    ローカルストレージへ保存します。
  </p>

  <p>
    このWebページではGoogle Drive内の
    ファイルを公開しません。
  </p>

  <h2>プライバシー</h2>
  <p>
    <a href="privacy.html">
      プライバシーポリシー
    </a>
  </p>
</body>
</html>
